<script type="module">

async function api(path,options={}){const headers={Accept:'application/json',...options.headers};if(options.body!==undefined){headers['Content-Type']='application/json';options.body=JSON.stringify(options.body)}const response=await fetch(path,{credentials:'same-origin',...options,headers});const text=await response.text();let root;try{root=JSON.parse(text)}catch{root=null}if(!response.ok){const e=root?.error;throw new Error(e?.message||`${response.status} ${response.statusText}`)}return unwrap(root)}

function agentTime(seconds){seconds=Math.max(0,Math.round(Number(seconds)||0));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60);return h?`${h}h ${m}m`:`${m}m`}
function groupMetrics(g){const s=state.groupStatistics[g.id],u=s?.combined_usage||{};if(!s)return '<div class="skeleton"></div><div class="skeleton"></div>';return `<div class="metrics" style="grid-template-columns:repeat(2,1fr);margin:10px 0"><div class="metric"><strong>${esc(s.runs)}</strong><span>runs</span></div><div class="metric"><strong>${esc(agentTime(s.agent_seconds))}</strong><span>agent time</span></div><div class="metric"><strong>${esc(Number(u.input_tokens||0).toLocaleString())}</strong><span>input tokens</span></div><div class="metric"><strong>${esc(Number(u.output_tokens||0).toLocaleString())}</strong><span>output tokens</span></div></div><div class="row small"><span class="grow muted">${esc(Number(u.total_tokens||0).toLocaleString())} total tokens</span><span class="muted">metered API cost</span><b>$${Number(u.cost_usd||0).toFixed(Number(u.cost_usd||0)>=1?2:4)}</b></div>`}
async function loadGroupStatistics(){const missing=state.groups.filter(g=>!state.groupStatistics[g.id]);if(!missing.length)return;const values=await Promise.all(missing.map(g=>softValue(`/api/v2/statistics?group=${encodeURIComponent(g.id)}`)));missing.forEach((g,i)=>{if(!values[i]?.error)state.groupStatistics[g.id]=values[i]});if(state.view==='groups'){renderGroups();bindActions()}}
function renderGroups(){loadGroupStatistics();$('content').innerHTML=renderMetrics(filteredRuns())+`<form class="card" id="group-form"><div class="row"><div class="grow"><label for="group-name" style="margin-top:0">New group</label><input id="group-name" required placeholder="Research"></div><div class="grow"><label for="group-cwd" style="margin-top:0">Default CWD (optional)</label><input id="group-cwd" class="mono" placeholder="/Users/me/Projects/research"></div><button class="primary">Create</button></div><p class="small muted">The path stays private on this Orchestra host. Runs may override it when dispatched.</p></form><div class="grid" style="margin-top:12px">${state.groups.map(g=>`<article class="card"><div class="row"><div class="grow"><h2>${esc(g.name)}</h2><div class="muted small">${esc(g.slug)} · next #${esc(g.next_number??'—')}</div></div></div>${groupMetrics(g)}<div class="tags" style="margin:10px 0"><span class="pill">default CWD ${g.cwd_configured?'configured':'unset'}</span>${g.slug==='general'?'<span class="pill">permanent default</span>':''}</div><div class="row"><button data-cwd-group="${g.id}">${g.cwd_configured?'Replace / clear CWD':'Set default CWD'}</button>${g.slug==='general'?'':`<button data-rename-group="${g.id}">Rename</button><button data-archive-group="${g.id}" class="danger">${g.archived?'Archived':'Archive'}</button>`}</div></article>`).join('')}</div>`}
function modelMatch(listed,value){return listed===value||value.endsWith('/'+listed)||listed.endsWith('/'+value)}
function discoveredModels(){const d=state.discovery?.runtimes||{},out=[];for(const m of d.codex?.data||[])out.push(m.model);for(const models of Object.values(d.opencode?.data||{}))out.push(...(models||[]));for(const p of d.reasonix?.data||[])out.push(...(p.models||[]));for(const m of state.discovery?.local_models||[])out.push(m.id);return [...new Set(out.filter(Boolean))]}
function discoveredEfforts(model){if(!model)return [];const d=state.discovery?.runtimes||{},out=[];for(const m of d.codex?.data||[])if(modelMatch(m.model,model))out.push(...(m.efforts||[]));for(const p of d.reasonix?.data||[])if((p.models||[]).some(x=>modelMatch(x,model)))out.push(...(p.efforts||[]));return [...new Set(out)]}

function profilePayload(form){const f=new FormData(form);let effort=String(f.get('effort_pick')||'');if(effort==='__custom__')effort=String(f.get('effort_custom')||'').trim();const body={name:String(f.get('name')||'').trim(),runtime_id:f.get('runtime_id'),model:f.get('model')||null,effort:effort||null,tier:Number(f.get('tier')),runway_source_id:f.get('runway_source_id')||null,note:f.get('note')||null,enabled:f.get('enabled')==='on'},env=replacementJSON(f.get('env'),'Environment'),config=replacementJSON(f.get('config'),'Configuration');if(env!==undefined){if(Object.values(env).some(value=>typeof value!=='string'))throw new Error('Environment values must be strings.');body.env=env}if(config!==undefined)body.config=config;return body}

function discoveryCard(title,result,body){return `<section class="card"><div class="row"><h3 class="grow">${esc(title)}</h3>${result?.error?'<span class="pill warn">error</span>':''}</div>${result?.error?`<p class="error">${esc(result.error)}</p>`:body||'<p class="muted">No models returned.</p>'}</section>`}
function renderDiscovery(d){const runtimes=d.runtimes||{},open=Object.entries(runtimes.opencode?.data||{}).map(([provider,models])=>`<div><b>${esc(provider)}</b><div class="tags">${(models||[]).map(x=>`<span class="pill mono">${esc(x)}</span>`).join('')}</div></div>`).join(''),codex=(runtimes.codex?.data||[]).map(x=>`<div><b class="mono">${esc(x.model)}</b><div class="small muted">${esc((x.efforts||[]).join(', ')||'No effort levels')}${x.default_effort?` · default ${esc(x.default_effort)}`:''}</div></div>`).join(''),reasonix=(runtimes.reasonix?.data||[]).map(x=>`<div><b>${esc(x.provider)}</b><div class="tags">${(x.models||[]).map(model=>`<span class="pill mono">${esc(model)}</span>`).join('')}</div><div class="small muted">${esc((x.efforts||[]).join(', ')||'No effort levels')}${x.default_effort?` · default ${esc(x.default_effort)}`:''}</div></div>`).join(''),local=(d.local_models||[]).map(x=>`<div class="row"><b class="grow mono">${esc(x.id)}</b><span class="pill">${esc(x.source)}</span></div>`).join('');return `<h2>Available models</h2><p class="muted">${d.local_requested?'Harness catalogs and models served on the Orchestra host.':'Harness catalogs only. Host-local inference was not probed.'}</p><div class="grid">${discoveryCard('Codex',runtimes.codex,codex)}${discoveryCard('OpenCode',runtimes.opencode,open)}${discoveryCard('Reasonix',runtimes.reasonix,reasonix)}${discoveryCard('Claude',runtimes.claude,'')}</div><section class="card" style="margin-top:12px"><h3>Host-local inference</h3>${local||`<p class="muted">${d.local_requested?'No local models returned.':'Not requested.'}</p>`}</section><p class="small muted">Discovery is read-only. Copy a model into a profile explicitly.</p>`}

function runwayWindows(windows=[]){return windows.map(w=>{const known=w.remaining_percent!=null||w.remaining!=null,percent=known?Math.max(0,Math.min(100,Number(w.remaining_percent??w.remaining))):null,reset=until(w.resets_at),models=Object.entries(w.per_model||{}).map(([model,value])=>`<span class="pill">${esc(model)} ${esc(value?.remaining_percent??value)}%</span>`).join(''),note=w.stale?esc(w.stale_reason||'stale reading'):reset?`resets in ${esc(reset)}`:'';return `<div><div class="row small"><b class="grow">${esc(w.name||w.window)}</b><span>${percent==null?'Unknown':`${percent}%`}${note?` · ${note}`:''}</span></div><div class="window"><i class="${percent===0?'zero':percent!=null&&percent<20?'low':''}" style="width:${percent??0}%"></i></div>${models?`<div class="tags" style="margin-top:6px">${models}</div>`:''}</div>`}).join('')||'<p class="muted">No current windows.</p>'}

}
function pairingClaim(raw){const text=String(raw||'').trim();if(!text.includes('://'))return {code:text,pairing_id:null};const url=new URL(text);return {code:url.searchParams.get('code')||'',pairing_id:url.searchParams.get('pairing_id')}}
async function redeemBrowser(raw,name){try{const claim=pairingClaim(raw);if(!claim.code)throw new Error('Enter a valid pairing code or Orchestra pairing URI.');state.instanceID=null;await api('/api/v2/pairing/redeem',{method:'POST',body:{request_id:requestID('redeem'),code:claim.code,pairing_id:claim.pairing_id,name:String(name||'Web browser'),browser:true}});state.error=null;showToast('Browser paired');await refresh()}catch(error){showToast(error.message)}}
function openDispatch(){openModal(`<h2>Dispatch a run</h2><label>Title <span class="muted">(optional metadata)</span></label><input id="new-title" placeholder="Research the vendor landscape"><div class="row"><div class="grow"><label>Group</label><select id="new-group">${filterOptions(state.groups,'')}</select></div><div class="grow"><label>Profile</label><select id="new-profile">${filterOptions(state.profiles.filter(p=>p.enabled!==false),'')}</select></div></div><label>Context / request</label><textarea id="new-context" required placeholder="What should this run do? Include any context it needs."></textarea><label>Working directory <span class="muted">(optional; overrides the group default)</span></label><input id="new-cwd" class="mono" placeholder="/Users/me/Projects/research"><p class="small muted">The path is resolved on the Orchestra host and is never returned to clients.</p>`,async()=>{const body={request_id:requestID('run'),group:$('new-group').value,profile:$('new-profile').value,context:$('new-context').value.trim(),requested_by:'web'},title=$('new-title').value.trim(),cwd=$('new-cwd').value.trim();if(title)body.title=title;if(cwd)body.cwd=cwd;try{const d=await api('/api/v2/runs',{method:'POST',body});closeModal();showToast(`${d.created?'Created':'Reused'} ${display(d.run)}`);await refresh({quiet:true});openRun(d.run.id)}catch(error){showToast(error.message)}})}
document.addEventListener('change',e=>{if(e.target.name==='effort_pick'){const custom=e.target.form?.elements.effort_custom;if(custom)custom.hidden=e.target.value!=='__custom__'}});
document.addEventListener('input',e=>{if(e.target.name!=='model'||!e.target.form)return;const form=e.target.form,sel=form.elements.effort_pick,box=form.elements.effort_custom;if(!sel)return;const current=sel.value==='__custom__'?String(box?.value||''):sel.value,efforts=discoveredEfforts(e.target.value),custom=Boolean(current)&&!efforts.includes(current);sel.innerHTML=`<option value="">—</option>${efforts.map(x=>`<option value="${esc(x)}" ${!custom&&x===current?'selected':''}>${esc(x)}</option>`).join('')}<option value="__custom__" ${custom?'selected':''}>Custom</option>`;if(box){box.hidden=!custom;if(custom)box.value=current}});
$('refresh').onclick=()=>refresh();$('dispatch').onclick=openDispatch;window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));renderNav();setView(location.hash.slice(1)||'runs');refresh();setInterval(()=>refresh({quiet:true}),45000);setInterval(()=>{if(state.view==='settings')loadServiceLog()},3000);
</script>
</body>
