<!doctype html>
<!-- Orchestra control panel (DESIGN §3, rebuilt for W-0178). One hand-written
     file: no build step, no CDN, no external font, no framework.

     Five views, one concern each, reached by the tabs: RUNS (master-detail,
     the default), PROFILES, SETTINGS, RUNWAY, HEALTH. The selected run's detail has a
     second tab strip of its own (W-0180) — trace, inbox/outbox, merge — under
     a header that never scrolls. The thread holds the run's whole
     conversation: brief first, tells and asks between, handoff last, the
     composer under it. Facts sit behind the ⓘ glyph beside the run's name.

     Every view OWNS THE VIEWPORT (W-0186): the page itself does not scroll,
     each view fills the height under the header, and the scrolling happens
     inside the panes — the run list in its column, the detail in its own.
     Nothing sits under a view any more, so nothing may leave dead space.

     A PROJECT PICKER in the header (W-0186) offers the projects the runs
     themselves name. It filters the run list and, in the profiles view, adds
     the ENABLED column (W-0187): profiles are global presets and always
     editable here, and what a project chooses is WHICH of them it may staff
     a run with. Runway and daemon health are the machine's, so they stay
     global. STATISTICS is a popup on the runs page rather than a card on
     health, and follows the picker.

     Everything it knows comes from
     GET /api/snapshot on a 4s poll, except the two live streams: the
     selected run's normalized trace (GET /api/runs/<id>/stream) and the
     daemon's own log (GET /api/log/stream), both SSE. EventSource cannot set
     headers, so those two ride the same-origin cookie the key form parks. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orchestra</title>
<!-- The favicon is inlined as a data URI: the page makes no external
     request. assets/orchestra-favicon.svg is the source of truth. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Crect%20width%3D%22128%22%20height%3D%22128%22%20rx%3D%2224%22%20fill%3D%22%230b0d10%22%2F%3E%3Cg%20fill%3D%22%23f3f4f2%22%3E%3Crect%20x%3D%2225%22%20y%3D%2255%22%20width%3D%2220%22%20height%3D%2242%22%20rx%3D%2210%22%20opacity%3D%22.45%22%2F%3E%3Crect%20x%3D%2254%22%20y%3D%2230%22%20width%3D%2220%22%20height%3D%2267%22%20rx%3D%2210%22%2F%3E%3Crect%20x%3D%2283%22%20y%3D%2246%22%20width%3D%2220%22%20height%3D%2251%22%20rx%3D%2210%22%20opacity%3D%22.7%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
  /* The original Orchestra palette, restored with the mark: saturated
     blue/green/red/amber against a near-black ground. */
  :root {
    --bg: #0f1115; --panel: #181b21; --line: #2a2f3a; --text: #e5e9f0;
    --dim: #8b95a5; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --live: #2563eb; --think: #8b5cf6; --tool: #0891b2; --sel: #1e2a44;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* The whole page is ONE column that owns the viewport: header, banners,
     then main taking every remaining pixel. Nothing below main, so a short
     list must not leave dead space — each view scrolls INSIDE itself
     (#runlist, #pbody, .card > .pad) and the page itself never scrolls. */
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; min-height: 0;
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .dim { color: var(--dim); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .prose { white-space: pre-wrap; overflow-wrap: anywhere; }

  header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
           padding: .7rem 1rem; border-bottom: 1px solid var(--line);
           flex: 0 0 auto; }
  h1 { font-size: .95rem; margin: 0; letter-spacing: .1em; text-transform: uppercase; }
  /* The mark drops its background tile here: the header is already its
     ground, and a second dark square inside a dark bar reads as a hole. */
  .mark { width: 1.35rem; height: 1.35rem; flex: none; }
  .live { font-size: 1.5rem; font-weight: 700; color: var(--live); line-height: 1; }
  .live small { font-size: .7rem; color: var(--dim); font-weight: 400; }
  /* The legacy runway rail flattened into the header: one glyph per
     provider — monogram + headroom — tinted by the same tone rules the
     runway cards use. The strip owns the header's spring, so an empty
     strip still pushes the tabs to the right edge. */
  #rwstrip { display: flex; gap: .25rem; flex-wrap: wrap; margin-left: auto; }
  .rwchip { display: flex; align-items: center; gap: .35rem; padding: .1rem .5rem;
            background: none; border: 1px solid var(--line); border-radius: 99px;
            font-size: 11px; }
  .rwchip:hover:enabled { background: var(--sel); }
  .rwchip span { color: var(--dim); font-weight: 700; letter-spacing: .04em; }
  .rwchip b { font-weight: 700; color: var(--ok); }
  .rwchip b.watch { color: var(--warn); }
  .rwchip b.critical { color: var(--bad); }
  .rwchip.unavailable { opacity: .55; }
  nav { display: flex; gap: .3rem; }
  nav button.tab { border-radius: 6px 6px 0 0; }
  nav button.tab.on { color: var(--live); border-color: var(--live); background: var(--sel); }

  /* --- the project picker (W-0186), where the snapshot stamp used to be ---
     Orchestra's #projBtn / #projMenu, read for its shape and rebuilt in this
     file's own el()/kv() idiom — every option here is a built node. */
  .proj { position: relative; }
  #projbtn { display: flex; align-items: center; gap: .45rem; font-size: 12.5px;
             padding: .3rem .6rem; max-width: 22rem; }
  .proj-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
              background: var(--live); }
  .proj-dot.all { background: var(--dim); }
  #projlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #projmenu { position: absolute; z-index: 20; top: calc(100% + .3rem); left: 0;
              min-width: 100%; max-width: 26rem; max-height: 60vh; overflow-y: auto;
              background: var(--panel); border: 1px solid var(--line);
              border-radius: 8px; padding: .25rem;
              box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
  .proj-opt { display: block; width: 100%; text-align: left; border: 0;
              background: none; border-radius: 6px; padding: .35rem .5rem; }
  .proj-opt:hover:enabled { background: var(--sel); }
  .proj-opt[aria-selected="true"] { color: var(--live); }
  .proj-opt .po-name { display: block; font-size: 12.5px; font-weight: 600; }
  .proj-opt .po-meta { display: block; font-size: 10.5px; color: var(--dim); }

  /* --- the statistics popup (W-0186) ---
     Statistics left the health view: health is the daemon's pulse, and
     numbers about runs belong to the runs page. <dialog> is the platform's
     own modal — Esc, the backdrop and focus trapping come with it. */
  #statsdlg { width: min(56rem, 92vw); max-height: 86vh; padding: 0;
              background: var(--panel); color: var(--text);
              border: 1px solid var(--line); border-radius: 8px;
              overflow: hidden; }
  #statsdlg::backdrop { background: rgba(0, 0, 0, .55); }
  #statsdlg .card { border: 0; border-radius: 0; max-height: 86vh; }

  button { font: inherit; font-size: 12px; color: var(--text); background: #262b33;
           border: 1px solid var(--line); border-radius: 6px;
           padding: .2rem .6rem; cursor: pointer; }
  button:hover:enabled { background: #323945; }
  button:disabled { color: var(--dim); cursor: not-allowed; opacity: .6; }
  button.pause { border-color: var(--warn); color: var(--warn); }
  button.resume { border-color: var(--ok); color: var(--ok); }
  button.danger { border-color: var(--bad); color: var(--bad); }
  input, select, textarea {
          font: inherit; font-size: 13px; padding: .3rem; background: #0f1114;
          color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
  input:disabled, select:disabled { opacity: .45; cursor: not-allowed; }

  #banner { padding: .4rem 1rem; background: #3a2a2a; color: #ffd7d7;
            border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  #banner:empty { display: none; }
  #paused { padding: .4rem 1rem; background: #3a3324; color: #ffe9b8;
            border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .keyform { padding: 2rem; display: grid; gap: .6rem; max-width: 32rem; }

  /* main owns the leftover height; the visible view fills it whole. */
  main { flex: 1; min-height: 0; padding: 1rem; overflow: hidden;
         display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; }
  .vstack { display: flex; flex-direction: column; gap: 1rem; }
  .grow { flex: 1; min-height: 0; }
  /* A card is a column: its header is fixed, its body is what scrolls. */
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 8px; overflow: hidden; min-width: 0;
          display: flex; flex-direction: column; min-height: 0; }
  .card > h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em;
               color: var(--dim); margin: 0; padding: .55rem .8rem;
               border-bottom: 1px solid var(--line); flex: 0 0 auto;
               display: flex; align-items: center; gap: .5rem; }
  .card > h2 .spacer { flex: 1; }
  .card > .pad { padding: .7rem .8rem; flex: 1; min-height: 0;
                 overflow-y: auto; display: flex; flex-direction: column; }

  /* --- runs: master-detail (Orchestra's .cols) --- */
  .cols { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 1rem; }
  /* Two side-by-side scrollers need real height to be worth anything. Below
     the breakpoint the columns stack, so the page scrolls instead. */
  @media (max-width: 980px) {
    .cols { grid-template-columns: 1fr; }
    main { overflow-y: auto; }
    #view-runs { flex: 0 0 auto; }
    #runlist, #pbody { max-height: 60vh; }
  }
  #runlist { flex: 1; min-height: 0; overflow-y: auto; }
  .runitem { padding: .5rem .8rem; border-bottom: 1px solid var(--line);
             cursor: pointer; border-left: 3px solid transparent; }
  .runitem:hover { background: var(--sel); }
  .runitem.sel { background: var(--sel); border-left-color: var(--live); }
  /* lineage, exactly as the run row records it: a spawned child, or the one
     automatic retry of an earlier attempt. */
  .runitem.related { border-left-color: #3d6ea8; }
  .runitem.continuation { border-left-color: #4b8a5a; }
  .runitem.sel.related, .runitem.sel.continuation { border-left-color: var(--live); }
  .runitem .top { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .runitem .title { margin-top: .25rem; font-size: 12.5px; font-weight: 600;
                    overflow: hidden; display: -webkit-box; line-clamp: 2;
                    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                    overflow-wrap: anywhere; }
  .runitem .meta { font-size: 11px; color: var(--dim); margin-top: .2rem;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* an unknown status still shows as a chip, never as invisible text.
     White text: the restored fills are 600-weight colours, too deep for
     the dark ink the pastels carried. */
  .chip { display: inline-block; padding: 0 .5rem; border-radius: 99px;
          font-size: 11px; font-weight: 600; color: #fff;
          background: var(--dim); }
  .c-running, .c-interrupt { background: var(--live); }
  .c-spawning { background: var(--warn); }
  .c-done { background: var(--ok); }
  .c-failed, .c-timeout { background: var(--bad); }
  .c-killed { background: var(--dim); }
  .c-blocked { background: var(--think); }
  .c-turn { background: var(--think); }

  /* control turns: one row per machine decision (W-0214) */
  .turnitem { padding: .45rem .2rem; border-bottom: 1px solid var(--line);
              font-size: 12.5px; }
  .turnitem:last-child { border-bottom: 0; }
  .turnitem .prose { margin-top: .2rem; color: var(--dim); }
  #runlist .turnitem { padding: .45rem .6rem; background: var(--panel); }

  /* The detail header and its tab strip sit outside #pbody, which is the only
     thing that scrolls — so name, status, tabs and stop never scroll away. */
  #phead { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
           padding: .5rem .8rem; border-bottom: 1px solid var(--line); }
  #phead, #ptabs { flex: 0 0 auto; }
  .run-actions { display: grid;
                 grid-template-columns: minmax(12rem, 1fr) auto;
                 gap: .5rem; align-items: end; }
  .run-actions textarea { width: 100%; min-height: 4.5rem; max-height: 12rem;
                          resize: vertical; }
  .run-actions > button { justify-self: end; }
  @media (max-width: 560px) {
    .run-actions { grid-template-columns: 1fr; }
  }
  /* Facts live behind a glyph at the end of the run's name row, not in
     the tab strip: metadata is reference, not a place you work. */
  .facts-glyph { margin-left: auto; border-radius: 99px; padding: 0 .5rem;
                 font-size: 12px; }
  .facts-glyph.on { color: var(--live); border-color: var(--live);
                    background: var(--sel); }
  /* Machine chatter (NOISE set) hides until its checkbox shows it. */
  .tracebox:not(.chatter) .titem.noise { display: none; }
  #ptabs { display: flex; gap: .3rem; flex-wrap: wrap;
           padding: .4rem .8rem; border-bottom: 1px solid var(--line); }
  #ptabs .stop-run { margin-left: auto; }
  #ptabs button.on { color: var(--live); border-color: var(--live);
                     background: var(--sel); }
  #pbody { flex: 1; min-height: 0; overflow-y: auto; padding: .7rem .8rem; }
  .block { margin-bottom: 1rem; }
  .block > h3 { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em;
                color: var(--dim); margin: 0 0 .4rem; font-weight: 700; }
  table.kv { border-collapse: collapse; font-size: 12.5px; width: 100%; }
  table.kv th { text-align: left; color: var(--dim); font-weight: 500;
                padding: .15rem .8rem .15rem 0; white-space: nowrap;
                vertical-align: top; width: 9rem; }
  table.kv td { padding: .15rem 0; font-family: var(--mono); overflow-wrap: anywhere; }
  table.grid { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.grid th, table.grid td { text-align: left; padding: .25rem .6rem .25rem 0;
        border-bottom: 1px solid var(--line); vertical-align: top; }
  table.grid th { color: var(--dim); font-weight: 500; white-space: nowrap; }
  table.grid td.grow { width: 100%; overflow-wrap: anywhere; }

  /* --- the trace ---
     Every line of a run's thread starts in the same 1.5rem gutter: a glyph
     says WHAT it is, the indent keeps the eye on one left edge. Colour is
     spent only on the three things that are not the agent talking to itself
     — thinking, tools, and conversation aimed AT the run. Ordinary assistant
     output gets no glyph and no gutter, so it reads as the answer. */
  .g { flex: 0 0 1.5rem; text-align: left; font-style: normal;
       font-size: 12.5px; line-height: 1.4; }
  .titem { margin: 0 0 .5rem; }
  .titem.evt { display: flex; align-items: baseline; gap: 0; }
  .titem.evt > .body { min-width: 0; flex: 1; }
  .titem.evt .label { font-size: 11.5px; text-transform: uppercase;
                      letter-spacing: .05em; font-weight: 600; }
  .titem.meta { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .titem.injection .label { color: var(--live); }
  .titem.permission .label { color: var(--warn); }
  details { border: 1px solid var(--line); border-radius: 6px; margin: .3rem 0;
            background: #171a20; }
  details > summary { cursor: pointer; padding: .25rem .6rem; font-size: 12.5px;
                      user-select: none; display: flex; align-items: baseline;
                      gap: .35rem; }
  details > summary .name { overflow-wrap: anywhere; }
  details[open] > summary { border-bottom: 1px solid var(--line); }
  details .inner { padding: .4rem .6rem .4rem 2.1rem; max-height: 26rem;
                   overflow: auto; }
  details pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere;
                font-family: var(--mono); font-size: 12px; }
  details.think > summary { color: var(--think); }
  details.tool > summary { color: var(--tool); }
  details.tool > summary .name { color: var(--text); }
  .msg { border-left: 3px solid var(--line); padding: .3rem .6rem; margin: .4rem 0; }
  .msg.inbound { border-left-color: var(--live); }
  .msg.outbound { border-left-color: var(--ok); }
  .diff { clear: both; margin: 0; border: 1px solid var(--line); border-radius: 6px;
          background: #111318; overflow: auto; font: 12px/1.45 var(--mono); }
  .diff-line { display: block; min-height: 1.45em; padding: 0 .6rem;
               white-space: pre; width: max-content; min-width: 100%; }
  .diff-add { background: rgba(111, 191, 115, .13); color: #a9d9ad; }
  .diff-del { background: rgba(217, 106, 106, .13); color: #e5a0a0; }
  .diff-meta { color: var(--live); }
  .msg .head { font-size: 11.5px; color: var(--dim); display: flex; gap: .4rem;
               flex-wrap: wrap; align-items: baseline; }
  .msg .head .g { flex-basis: 1.1rem; }
  .msg .head .label { color: var(--text); font-weight: 600;
                      text-transform: uppercase; letter-spacing: .05em; }
  .msg > :not(.head) { margin-left: 1.5rem; }
  .badge { border: 1px solid var(--line); border-radius: 99px; padding: 0 .45rem;
           font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
  .b-queued { color: var(--warn); border-color: var(--warn); }
  .b-delivered { color: var(--live); border-color: var(--live); }
  .b-answered { color: var(--ok); border-color: var(--ok); }
  .b-undeliverable { color: var(--bad); border-color: var(--bad); }

  /* --- runway: ONE collapsible card per provider, its windows inside --- */
  .track { height: 5px; margin-top: .35rem; border-radius: 99px;
           background: #2a2f39; overflow: hidden; }
  .fill { height: 100%; background: var(--ok); }
  .fill.watch { background: var(--warn); }
  .fill.critical { background: var(--bad); }
  #runway { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
            gap: .6rem; align-items: start; }
  details.rw { margin: 0; background: var(--panel); }
  details.rw > summary { display: flex; align-items: center; gap: .6rem;
                         min-height: 3.2rem; padding: .5rem .7rem; }
  .rwname { min-width: 0; flex: 1; }
  .rwname strong { display: block; font-size: 13px; }
  .rwname span { display: block; color: var(--dim); font-size: 10.5px; }
  .rwvalue { font-size: 15px; font-weight: 700; color: var(--ok); }
  .rwvalue.watch { color: var(--warn); }
  .rwvalue.critical { color: var(--bad); }
  .rwvalue.unknown { color: var(--dim); font-size: 12px; font-weight: 400; }
  .rwbody { padding: .5rem .7rem .6rem; }
  .rwq { margin: 0 0 .7rem; }
  .rwq:last-child { margin-bottom: 0; }
  .rwqhead { display: flex; justify-content: space-between; gap: .5rem;
             font-size: 11.5px; }
  .rwunknown { color: var(--dim); font-weight: 500; }
  .rwage { color: var(--warn, #d08770); font-size: 11px; }
  .rwmeta { margin-top: .25rem; color: var(--dim); font-size: 10.5px; }
  .rwmeta.warn { color: var(--warn); }
  .rwbal { margin: 0 0 .6rem; padding: .45rem .55rem; border-radius: 6px;
           background: #1f242c; color: var(--dim); font-size: 11.5px; }
  .rwbal strong { color: var(--text); font-size: 15px; }
  #runwaystamp { text-transform: none; letter-spacing: 0; font-weight: 400; }

  /* --- profiles editor (W-0173) --- */
  #editor { display: grid; gap: .45rem; margin-top: .7rem;
            border-top: 1px solid var(--line); padding-top: .7rem; }
  #editor label { display: grid; grid-template-columns: 9rem minmax(0, 28rem);
                  gap: .5rem; align-items: center; }
  #editor .hint { color: var(--dim); font-size: .8rem; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .checklist { display: flex; flex-wrap: wrap; gap: .1rem .8rem;
               border: 1px solid var(--line); border-radius: 4px; padding: .3rem; }
  .checklist label { display: inline-flex !important; gap: .3rem;
                     grid-template-columns: none !important; }
  /* The enabled column (W-0187): one checkbox per profile, only when a
     project is picked. The whole cell is the hit target. */
  .enabledbox { display: flex; align-items: center; justify-content: center;
                cursor: pointer; }
  .enabledbox input { cursor: pointer; }
  .noteedit { display: flex; gap: .4rem; align-items: baseline; }
  .noteedit .dim { white-space: nowrap; font-size: .8rem; }
  button.glyph { font-size: 1rem; line-height: 1; padding: .15rem .45rem; }
  /* The log tail is its own scroller (the stream pins it to the bottom), so
     it takes the height its card is given rather than a fixed slice of the
     viewport. */
  #logtail { flex: 1; min-height: 0; overflow-y: auto; font-family: var(--mono);
             font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* Raw config (W-0190): the file is the form. */
  #cfgtext { flex: 1; min-height: 0; width: 100%; resize: none;
             font-family: var(--mono); font-size: 12px; line-height: 1.45; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="paused" hidden></div>
<header>
  <svg class="mark" viewBox="0 0 128 128" role="img" aria-label="Orchestra"><g fill="#f3f4f2"><rect x="25" y="55" width="20" height="42" rx="10" opacity=".45"/><rect x="54" y="30" width="20" height="67" rx="10"/><rect x="83" y="46" width="20" height="51" rx="10" opacity=".7"/></g></svg>
  <h1>orchestra</h1>
  <div class="live"><span id="livecount">–</span> <small>live</small></div>
  <!-- The project picker stands where the snapshot stamp used to (W-0186).
       Its options are the projects the snapshot's runs name and no others,
       plus "all projects"; the stamp itself moved into the statistics
       popup, which is the one place a version number is worth reading. -->
  <div class="proj" id="projsel" hidden>
    <button id="projbtn" type="button" aria-haspopup="listbox"
            aria-expanded="false" aria-controls="projmenu">
      <span class="proj-dot all" id="projdot" aria-hidden="true"></span>
      <span id="projlabel">all projects</span>
      <span class="dim" aria-hidden="true">▾</span>
    </button>
    <div id="projmenu" role="listbox" aria-label="projects with runs" hidden></div>

  <nav id="tabs">

  <section class="view vstack" id="view-settings" hidden>

                  aria-label="config.toml"></textarea>

  <section class="view vstack" id="view-health" hidden>
    <div class="card" style="flex:0 0 auto">

         merge judgments — recorded as layered runs rows (W-0214) that the
         board deliberately never lists. This card is their reading surface. -->

      <h2>control turns <span class="dim" id="turnstate"></span></h2>

<!-- The statistics popup, opened from the runs page. It reads the selected
     project's numbers when one is picked, and every run's otherwise. -->
<dialog id="statsdlg" aria-labelledby="statstitle">
  <div class="card">
    <h2 id="statstitle">statistics <span class="dim" id="statsscope"
          style="text-transform:none;letter-spacing:0"></span>

              >close</button></h2>
