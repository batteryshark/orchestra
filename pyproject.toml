[project]
name = "orchestra"
license = "MIT"
license-files = ["LICENSE"]
version = "2.0.0"
description = "Independent local agent-fleet runner with durable control, evidence, and universal clients"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orchestra = "orchestra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestra"]
