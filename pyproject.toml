[project]
name = "orchestra"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
description = "Local execution plane for supported agent harnesses with durable runs, traces, controls, and results"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orchestra = "orchestra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestra"]
