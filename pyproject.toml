[project]
name = "orchestra"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
description = "Local control plane that turns agent CLIs (codex, claude, opencode, reasonix) into a coordinated team"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orchestra = "orchestra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestra"]
