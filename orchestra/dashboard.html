<form class="keyform" id="keyform" hidden>
  <p>Paste the shared secret (the <code>key</code> in
     <code>~/.config/orchestra/config.toml</code>).</p>
  <input type="password" id="keyinput" autocomplete="off" placeholder="X-Orchestra-Key">
  <button type="submit">unlock</button>
</form>

<script>
"use strict";
const POLL_MS = 4000;
const $ = (id) => document.getElementById(id);

// --- credential -------------------------------------------------------------
// The header is what the API demands. The cookie exists because EventSource
// cannot set headers, so the two SSE routes ride it on a same-origin GET.
function readKey() {
  const m = document.cookie.match(/(?:^|;\s*)orchestra_key=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : (localStorage.getItem("orchestra_key") || "");
}
function saveKey(k) {
  localStorage.setItem("orchestra_key", k);
  document.cookie = "orchestra_key=" + encodeURIComponent(k) +
                    "; Path=/; Max-Age=31536000; SameSite=Strict";
}
let KEY = readKey();

async function api(path, opts) {
  const o = Object.assign({headers: {}}, opts || {});
  o.headers["X-Orchestra-Key"] = KEY;
  if (o.body) o.headers["Content-Type"] = "application/json";
  const res = await fetch(path, o);
  const text = await res.text();
  if (!res.ok) throw new Error(res.status + " " + text.trim());
  return text ? JSON.parse(text) : {};
}
function fail(e) { $("banner").textContent = String((e && e.message) || e); }
async function act(path, opts) {
  try { await api(path, opts); await refresh(); } catch (e) { fail(e); }
}

// --- tiny DOM helpers -------------------------------------------------------
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}
function kv(rows) {
  const t = el("table", "kv"), tb = el("tbody");
  rows.forEach(([label, value]) => {
    if (value === undefined) return;
    const tr = el("tr");
    tr.append(el("th", null, label));
    const td = el("td");
    if (value instanceof Node) td.appendChild(value);
    else td.textContent = value === null || value === "" ? "–" : String(value);
    tr.appendChild(td);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return t;
}
function table(headers, rows) {
  const t = el("table", "grid"), thead = el("thead"), tr = el("tr");
  headers.forEach((h) => tr.appendChild(el("th", null, h)));
  thead.appendChild(tr); t.appendChild(thead);
  const tb = el("tbody");
  rows.forEach((cells) => {
    const r = el("tr");
    cells.forEach((c) => {
      const td = el("td");
      if (c instanceof Node) td.appendChild(c);
      else if (c && c.node) { td.appendChild(c.node); td.className = c.cls || ""; }
      else td.textContent = (c === null || c === undefined) ? "–" : String(c);
      r.appendChild(td);
    });
    tb.appendChild(r);
  });
  t.appendChild(tb);
  return t;
}
function block(title, node) {
  const b = el("div", "block");
  b.append(el("h3", null, title), node);
  return b;
}
function dur(s) {
  if (s === null || s === undefined) return "–";
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  return (s / 3600).toFixed(1) + "h";
}
function num(n) {
  return (n === null || n === undefined) ? "–" : n.toLocaleString();
}
function money(n) {
  return (n === null || n === undefined) ? "–" : "$" + Number(n).toFixed(4);
}
// Every stamp the snapshot carries is "%Y-%m-%dT%H:%M:%SZ".
function ageSeconds(stamp) {
  const t = Date.parse(stamp || "");
  return isNaN(t) ? null : Math.max(0, (Date.now() - t) / 1000);
}
function ago(stamp) {
  const s = ageSeconds(stamp);
  return s === null ? "–" : dur(s) + " ago";
}
function statusChip(run) {
  const blocked = run.blocked_on && run.blocked_on.length;
  const label = blocked ? "blocked on " + run.blocked_on.join(",") : run.status;
  return el("span", "chip " + (blocked ? "c-blocked" : "c-" + run.status), label);
}

// --- views ------------------------------------------------------------------
let VIEW = "runs";
function showView(name) {
  VIEW = name;
  ["runs", "profiles", "settings", "runway", "health"].forEach((v) => {
    $("view-" + v).hidden = v !== name;
  });
  document.querySelectorAll("#tabs .tab").forEach((b) => {
    b.classList.toggle("on", b.dataset.view === name);
  });
  // Neither stream runs behind a view nobody is looking at.
  if (name === "health") { openLog(); loadTurns(); } else closeLog();
  if (name === "runway") refreshRunway();  // opening the view is a request
  if (name === "settings") loadConfig();
  syncTrace();
}
document.querySelectorAll("#tabs .tab").forEach((b) => {
  b.onclick = () => showView(b.dataset.view);
});

// --- the project picker (W-0186) --------------------------------------------
// It offers EXACTLY the projects the snapshot's runs name, plus "all
// projects" — not every project on the machine, because a project you have
// never kicked a run off from would filter the board to nothing.
//
// Picking one filters the runs list and turns on the ENABLED column in the
// profiles view (W-0187). Profiles themselves are GLOBAL presets and stay
// editable whatever is picked; `/api/project` answers with the project's
// enabled set (null = every profile), and the checkbox POSTs it back.
// Runway and daemon health stay global: a provider's quota and the
// sweeper's pulse belong to the machine.
//
// The choice lives for as long as the page is open. Nothing is persisted —
// a reload starts on the whole board, which is the honest default.
let PROJECT = null;      // a project_id, or null for "all projects"
let SCOPE = null;        // /api/project: {enabled_profiles, statistics}
let SCOPE_WAIT = false;

function projectName(id) {
  const p = ((SNAP && SNAP.projects) || []).find((x) => x.project_id === id);
  return (p && (p.name || p.project_id)) || id;
}

function visibleRuns(s) {
  return PROJECT === null ? s.runs
       : s.runs.filter((r) => r.project_id === PROJECT);
}

function renderProjects(s) {
  const projects = s.projects || [];
  $("projsel").hidden = !projects.length;
  // The selected project's last run aged out of the snapshot window, so it
  // is no longer something to switch to. Fall back rather than show a board
  // filtered to nothing by a name that is not in the menu.
  if (PROJECT !== null && !projects.some((p) => p.project_id === PROJECT)) {
    PROJECT = null;
    SCOPE = null;
  }
  const cur = projects.find((p) => p.project_id === PROJECT);
  $("projlabel").textContent = cur ? (cur.name || cur.project_id) : "all projects";
  $("projdot").className = "proj-dot" + (cur ? "" : " all");
  const total = projects.reduce((n, p) => n + p.runs, 0);
  $("projmenu").replaceChildren(
    projectOption(null, "all projects", total + " runs"),
    ...projects.map((p) => projectOption(p.project_id, p.name || p.project_id,
                                         p.runs + " runs · " + p.live + " live")));
}

function projectOption(id, name, meta) {
  const b = el("button", "proj-opt");
  b.type = "button";
  b.setAttribute("role", "option");
  b.setAttribute("aria-selected", PROJECT === id ? "true" : "false");
  b.append(el("span", "po-name", name), el("span", "po-meta", meta));
  b.onclick = () => { openProjectMenu(false); setProject(id); };
  return b;
}

function openProjectMenu(open) {
  const menu = $("projmenu");
  const next = open === undefined ? menu.hidden : open;
  menu.hidden = !next;
  $("projbtn").setAttribute("aria-expanded", next ? "true" : "false");
}

function setProject(id) {
  if (PROJECT === id) return;
  PROJECT = id;
  SCOPE = null;
  // A run of some other project is off the board now, so it cannot stay
  // selected — and its trace must not keep streaming behind the filter.
  if (SELECTED !== null && SNAP &&
      !visibleRuns(SNAP).some((r) => r.id === SELECTED)) {
    SELECTED = null;
    syncTrace();
  }
  if (SNAP) render(SNAP);
}

// One route for both project-scoped reads, re-fetched on the poll rather
// than cached: statistics are a running total over the whole runs table, and
// a stale total is worse than one more scan of a local SQLite file. The
// in-flight guard is what keeps it to one request per tick.
function loadScope() {
  if (PROJECT === null || SCOPE_WAIT) return;
  SCOPE_WAIT = true;
  const want = PROJECT;
  api("/api/project?id=" + encodeURIComponent(want)).then((d) => {
    if (PROJECT !== want) return;   // switched again while this was in flight
    SCOPE = d;
    if (SNAP) render(SNAP);
  }).catch(fail).finally(() => { SCOPE_WAIT = false; });
}

$("projbtn").onclick = (e) => { e.stopPropagation(); openProjectMenu(); };
document.addEventListener("click", (e) => {
  const sel = $("projsel");
  if (!sel.hidden && !sel.contains(e.target)) openProjectMenu(false);
});

// --- runs: the list ---------------------------------------------------------
let SNAP = null, SELECTED = null;
const INSTRUCTION_DRAFTS = new Map();

function selectRun(id) {
  if (SELECTED === id) return;
  SELECTED = id;
  syncTrace();
  if (SNAP) { renderRunList(SNAP); renderDetail(SNAP); }
}

function renderRunList(s) {
  const box = $("runlist");
  const runs = visibleRuns(s);
  $("runcount").textContent = runs.length ? "(" + runs.length + ")" : "";
  // The scoped project's newest control turn, pinned above its runs
  // (W-0214). Only when a project is picked: a staffing decision about
  // another project pinned here would read as if it happened here. The
  // full feed lives on the health view.
  const pinned = PROJECT === null ? null
    : (s.pinned_turns || []).find((t) => t.project_id === PROJECT);
  const pin = pinned ? [turnItem(pinned)] : [];
  if (!runs.length) {
    box.replaceChildren(...pin, el("div", "runitem dim", PROJECT === null
      ? "no runs yet — `orchestra run`"
      : "no runs for " + projectName(PROJECT) + " in the snapshot window"));
    return;
  }
  const ids = new Set(runs.map((r) => r.id));
  box.replaceChildren(...pin, ...runs.map((r) => {
    const lineage = (r.retry_of && ids.has(r.retry_of)) ? " continuation"
                  : (r.parent_run && ids.has(r.parent_run)) ? " related" : "";
    const item = el("div", "runitem" + lineage + (r.id === SELECTED ? " sel" : ""));
    const top = el("div", "top");
    top.append(el("span", "mono", "#" + r.id));
    if (r.slug) top.append(el("span", "mono dim", r.slug));
    top.append(statusChip(r));
    const when = el("span", "mono dim", dur(r.elapsed_seconds));
    when.style.marginLeft = "auto";
    top.append(when);
    item.append(top);
    item.append(el("div", "title", r.title || "(no title recorded)"));
    item.append(el("div", "meta", [
      r.profile, r.backend, r.work_item, r.project,
      r.retry_of ? "retry of #" + r.retry_of : "",
      r.parent_run ? "parent #" + r.parent_run : "",
    ].filter(Boolean).join(" · ")));
    item.onclick = () => selectRun(r.id);
    return item;
  }));
}

// --- runs: the detail pane --------------------------------------------------
function instructionPane(r) {
  const box = el("form", "run-actions");
  const area = el("textarea");
  area.rows = 3;
  area.placeholder = "Correction or instruction for run #" + r.id;
  area.setAttribute("aria-label", "instruction for run #" + r.id);
  area.value = INSTRUCTION_DRAFTS.get(r.id) || "";
  const send = el("button", null, "send instruction");
  send.type = "submit";
  send.disabled = !r.session_ref || !area.value.trim();
  send.title = r.session_ref ? "send at the run's next safe action boundary"
                             : "available once the run's session starts";
  area.oninput = () => {
    INSTRUCTION_DRAFTS.set(r.id, area.value);
    send.disabled = !r.session_ref || !area.value.trim();
  };
  box.append(area, send);
  box.onsubmit = async (e) => {
    e.preventDefault();
    const text = area.value.trim();
    if (!text || !r.session_ref) return;
    send.disabled = true;
    try {
      await api("/api/runs/" + r.id + "/tell",
                {method: "POST", body: JSON.stringify({text: text})});
      INSTRUCTION_DRAFTS.delete(r.id);
      area.value = "";
      await refresh();
    } catch (err) { fail(err); }
    finally { send.disabled = !r.session_ref || !area.value.trim(); }
  };
  return box;
}

// The run's final summary, drawn as the closing message of its thread:
// the handoff is the last thing the run says.
function handoffItem(text) {
  const item = el("div", "msg outbound");
  const head = el("div", "head");
  head.append(el("i", "g", "\u{1F4E4}"), el("span", "label", "handoff"),
              el("span", "dim", "the run's final summary"));
  item.append(head, el("div", "prose", text));
  return item;
}

function messageItem(m) {
  const item = el("div", "msg " + m.direction);
  const head = el("div", "head");
  head.append(el("i", "g", msgGlyph(m)));
  head.append(el("span", "label", m.kind || "message"));
  head.append(el("span", null, m.direction === "inbound" ? "→ " + m.sender
                                                         : "← " + m.sender));
  head.append(el("span", "badge b-" + m.state, m.state));
  if (m.pending_boundary)
    head.append(el("span", "dim", "waiting for a safe action boundary"));
  head.append(el("span", "dim mono", m.created_at || ""));
  item.append(head);
  if (m.undeliverable_reason)
    item.append(el("div", "bad", m.undeliverable_reason));
  item.append(el("div", "prose", m.body || ""));
  return item;
}

// A brief is written once at dispatch and never changes, so it is fetched
// once per run and kept — the 4s poll re-renders this pane constantly, and
// re-reading the file on every tick is what the route exists to avoid.
// A failed read caches nothing, so the next re-render tries again.
const BRIEFS = new Map();
const BRIEF_WAIT = new Set();
function loadBrief(id) {
  if (BRIEF_WAIT.has(id)) return;
  BRIEF_WAIT.add(id);
  api("/api/runs/" + id + "/brief").then((b) => {
    BRIEFS.set(id, b);
    if (SNAP && SELECTED === id && runTab() === "messages") renderDetail(SNAP);
  }).catch(fail).finally(() => BRIEF_WAIT.delete(id));
}

// Diffs are also read only when their tab opens. A completed run is immutable;
// refresh makes the committed view of an active run an explicit choice.
const DIFFS = new Map();
const DIFF_WAIT = new Set();
function loadDiff(id, refresh) {
  if (DIFF_WAIT.has(id)) return;
  if (refresh) DIFFS.delete(id);
  DIFF_WAIT.add(id);
  api("/api/runs/" + id + "/diff").then((d) => {
    DIFFS.set(id, d);
    if (SNAP && SELECTED === id && runTab() === "merge") renderDetail(SNAP);
  }).catch(fail).finally(() => DIFF_WAIT.delete(id));
}

function renderDiff(text) {
  const pre = el("pre", "diff");
  pre.append(...text.split("\n").map((line) => {
    let cls = "diff-line";
    if (line.startsWith("diff ") || line.startsWith("index ") ||
        line.startsWith("@@") || line.startsWith("---") || line.startsWith("+++")) {
      cls += " diff-meta";
    } else if (line.startsWith("+")) cls += " diff-add";
    else if (line.startsWith("-")) cls += " diff-del";
    return el("span", cls, line);
  }));
  return pre;
}

// --- runs: the detail tabs (W-0180) -----------------------------------------
// One tab at a time, because a run is opened to watch its trace and read its
// thread, and everything else used to be a long scroll away. The strip lives
// beside the header, outside the scrolling body; trace is the default.
const TABS = [
  ["trace", "trace"],
  ["messages", "inbox / outbox"],
  ["merge", "merge"],
];
// Remembered per run for as long as the page is open: come back to a run and
// it is on the tab you left it on. Nothing is persisted across a reload.
const RUN_TAB = new Map();

function runTab() {
  const key = RUN_TAB.get(SELECTED);
  return PANES[key] ? key : "trace";
}
function setRunTab(key) {
  if (SELECTED === null || runTab() === key) return;
  RUN_TAB.set(SELECTED, key);
  syncTrace();
  if (SNAP) renderDetail(SNAP);
  $("pbody").scrollTop = 0;
}
function renderTabs(run) {
  const strip = $("ptabs");
  strip.hidden = !run;
  if (!run) return strip.replaceChildren();
  const active = runTab();
  strip.replaceChildren(...TABS.map(([key, label]) => {
    const b = el("button", key === active ? "on" : null, label);
    b.onclick = () => setRunTab(key);
    return b;
  }));
  if (run.live) {
    const stop = el("button", "danger stop-run", "stop run");
    stop.onclick = () => {
      if (confirm("stop run #" + run.id + "?"))
        act("/api/runs/" + run.id + "/stop", {method: "POST"});
    };
    strip.append(stop);
  }
}

// One builder per tab. Every one of them renders with empty data: a tab with
// nothing in it says so, and a tab that cannot apply says why.
const PANES = {
  trace: tracePane,

  // The whole conversation WITH the run in one place. The brief opens it —
  // it is the first thing put in — tells and asks follow, the handoff closes
  // it, and the composer sits under the thread like any reply box. The brief
  // file is read once per run by /api/runs/<id>/brief; it is not in the
  // snapshot, which carries every run every 4s.
  messages: (s, r) => {
    const box = el("div");
    const b = BRIEFS.get(r.id);
    if (b === undefined) {
      loadBrief(r.id);
      box.append(el("p", "dim", "reading the brief file…"));
    } else if (b.text) {
      box.append(collapsible("msg-brief", MSG_GLYPH.tell, "brief",
        "what the run was dispatched with", b.text,
        {payload_len: b.text.length, truncated: false}));
    }
    const thread = (r.messages || []).filter((m) => m.kind !== "merge");
    thread.forEach((m) => box.append(messageItem(m)));
    if (!thread.length)
      box.append(el("p", "dim",
        "nothing was told to this run and it asked nothing"));
    // A Work-backed run's completion writeback already carries the summary
    // into the thread; a second handoff card under it would say it twice.
    if (r.summary && !thread.some((m) => m.kind === "completion"))
      box.append(handoffItem(r.summary));
    if (r.live) box.append(instructionPane(r));
    return box;
  },

  facts: (s, r) => kv([
    ["profile", r.profile],
    // The router's one-liner from the staffing turn (W-0183) — why THIS
    // profile got the work. Absent on manual dispatches and continuations;
    // kv skips undefined rows entirely.
    ["staffing", r.routed_reason || undefined],
    ["harness", r.backend + (r.model ? " · " + r.model : "")],
    ["isolation", r.isolation],
    ["project", r.project || r.project_id],
    ["work item", r.work_item],
    ["branch", r.branch],
    ["base commit", r.base_commit],
    ["checkpoint", r.checkpoint_commit],
    ["workdir", r.workdir],
    ["brief file", r.brief_path],
    ["session", r.session_ref],
    ["requested by", r.requested_by],
    ["lineage", lineageNode(s, r)],
    ["started", r.started_at],
    ["finished", r.finished_at],
    ["elapsed", dur(r.elapsed_seconds)],
    ["exit code", r.exit_code],
    ["tokens", r.tokens_total === null && r.tokens_in === null
        ? "not captured"
        : num(r.tokens_total) + " (in " + num(r.tokens_in) +
          " / out " + num(r.tokens_out) + ")"],
    // A plan-backed run has no price: OpenCode's cost 0 on subscription data
    // is not free work, and a bare dash says nothing (W-0179).
    ["cost", r.billing === "plan" ? "plan"
             : r.cost_usd === null ? "not captured" : money(r.cost_usd)],
    ["usage from", r.usage_source],
  ]),

  // The merge report is written into the run's own thread as a message of
  // kind `merge` (merge._thread), so it needs no second source.
  merge: (s, r) => {
    const box = el("div");
    const merges = (r.messages || []).filter((m) => m.kind === "merge");
    box.append(block("report", merges.length ? wrap(merges.map(messageItem))
      : el("p", "dim", r.branch ? "nothing landed yet"
                                : r.isolation === "not_started"
                                  ? "no branch — execution never started"
                                  : "no branch — this run worked in the shared tree")));
    const changes = el("div");
    const d = DIFFS.get(r.id);
    if (d !== undefined && r.branch) {
      const refresh = el("button", null, "refresh");
      refresh.style.cssText = "float:right;margin-bottom:.4rem";
      refresh.onclick = () => loadDiff(r.id, true);
      changes.append(refresh);
    }
    if (d === undefined) {
      loadDiff(r.id);
      changes.append(el("p", "dim", "reading committed changes…"));
    } else if (d.text) {
      changes.append(renderDiff(d.text));
      if (d.truncated) changes.append(el("p", "warn", "diff truncated at 250 KB"));
    } else {
      changes.append(el("p", "dim", d.message || "no committed changes"));
    }
    box.append(block("changes", changes));
    return box;
  },

};

function tracePane() {
  const pane = el("div", "block");
  // No title: the tab strip above already names this pane.
  const h3 = el("h3", null, "stream ");
  const state = el("span", "dim");
  state.id = "tracestate";
  state.textContent = TRACE_STATE;
  const follow = el("label", "dim");
  follow.style.cssText = "float:right;font-weight:400;text-transform:none";
  const cb = el("input"); cb.type = "checkbox"; cb.id = "followcb"; cb.checked = FOLLOW;
  cb.onchange = () => { FOLLOW = cb.checked; };
  follow.append(cb, el("span", null, " follow tail"));
  const chat = el("label", "dim");
  chat.style.cssText =
    "float:right;font-weight:400;text-transform:none;margin-right:.9rem";
  const cb2 = el("input"); cb2.type = "checkbox"; cb2.checked = CHATTER;
  cb2.onchange = () => {
    CHATTER = cb2.checked;
    TRACE_BOX.classList.toggle("chatter", CHATTER);
  };
  chat.append(cb2, el("span", null, " machine chatter"));
  h3.append(state, follow, chat);
  pane.append(h3, TRACE_BOX);
  return pane;
}

function renderDetail(s) {
  const r = s.runs.find((x) => x.id === SELECTED);
  const head = $("phead"), body = $("pbody");
  if (!r) {
    head.replaceChildren(el("span", "dim",
      SELECTED === null ? "select a run" : "run #" + SELECTED +
      " is no longer in the snapshot window"));
    renderTabs(null);
    body.replaceChildren();
    closeTrace();
    return;
  }
  head.replaceChildren();
  head.append(el("span", "mono", "#" + r.id));
  if (r.slug) head.append(el("span", "mono dim", r.slug));
  head.append(statusChip(r));
  if (r.work_item) head.append(el("span", "mono", r.work_item));
  // Facts left the tab strip: eighteen rows of metadata are reference, not a
  // place you work, so they live behind a glyph beside the run's name.
  const facts = el("button",
    "facts-glyph" + (runTab() === "facts" ? " on" : ""), "ⓘ");
  facts.title = "run facts";
  facts.onclick = () => setRunTab(runTab() === "facts" ? "trace" : "facts");
  head.append(facts);
  renderTabs(r);
  const pane = runTab();
  // A snapshot lands every four seconds. Do not replace the composer while
  // the human is typing; the next poll after focus leaves may rebuild it.
  if (pane !== "messages" || !body.contains(document.activeElement))
    body.replaceChildren(PANES[pane](s, r));
}

function wrap(nodes) {
  const box = el("div");
  nodes.forEach((n) => box.appendChild(n));
  return box;
}

function lineageNode(s, r) {
  const box = el("span");
  const link = (label, id) => {
    if (!s.runs.some((x) => x.id === id)) return el("span", null, label + " (aged out)");
    const b = el("button", null, label);
    b.onclick = () => selectRun(id);
    return b;
  };
  if (r.parent_run) box.append(link("parent #" + r.parent_run, r.parent_run), " ");
  if (r.retry_of) box.append(link("retry of #" + r.retry_of, r.retry_of), " ");
  const kids = s.runs.filter((x) => x.parent_run === r.id || x.retry_of === r.id);
  kids.forEach((k) => box.append(link("→ #" + k.id, k.id), " "));
  if (!box.childNodes.length) box.append(el("span", null, "–"));
  return box;
}

// --- the trace stream (SSE) -------------------------------------------------
// The trace pane is owned by the stream, never by the 4s poll: the box node is
// kept across re-renders so appended events and open <details> survive.
const TRACE_BOX = el("div", "tracebox");
let TRACE = null, TRACE_RUN = null, TRACE_STATE = "", FOLLOW = true,
    CHATTER = false;

function setTraceState(text) {
  TRACE_STATE = text;
  const node = $("tracestate");
  if (node) node.textContent = text;
}

// The one place that decides whether a stream should exist: only the selected
// run, only while its trace tab is the visible one. Nothing is left connected
// behind a hidden tab. TRACE_RUN is the run the box holds, so a stream that
// ended on its own is not reopened by the next call.
function syncTrace() {
  const want = (VIEW === "runs" && SELECTED !== null && runTab() === "trace")
             ? SELECTED : null;
  if (want === TRACE_RUN) return;
  closeTrace();
  if (want !== null) openTrace(want);
}

function openTrace(runId) {
  TRACE_RUN = runId;
  TRACE_BOX.replaceChildren(el("p", "dim", "connecting…"));
  setTraceState("· live");
  let empty = true;
  const src = new EventSource("/api/runs/" + runId + "/stream");
  TRACE = src;
  src.addEventListener("trace", (e) => {
    if (empty) { TRACE_BOX.replaceChildren(); empty = false; }
    let row;
    try { row = JSON.parse(e.data); } catch (err) { return; }
    TRACE_BOX.appendChild(traceItem(row));
    if (FOLLOW) $("pbody").scrollTop = $("pbody").scrollHeight;
  });
  src.addEventListener("end", () => {
    if (empty) TRACE_BOX.replaceChildren(
      el("p", "dim", "no events — this run wrote nothing the parsers recognised"));
    setTraceState("· ended");
    src.close();
    if (TRACE === src) TRACE = null;
  });
  // EventSource reconnects by itself with Last-Event-ID; say so rather than
  // offering a reconnect button that duplicates what the browser already does.
  src.onerror = () => { if (TRACE === src) setTraceState("· reconnecting…"); };
  src.onopen = () => {
    if (TRACE !== src) return;
    setTraceState("· live");
    if (empty) TRACE_BOX.replaceChildren(el("p", "dim",
      "no events yet — nothing the parsers recognise has been written"));
  };
}

function closeTrace() {
  if (TRACE) { TRACE.close(); TRACE = null; }
  TRACE_RUN = null;
  setTraceState("");
}

// One glyph per normalized event kind (traces.KINDS). A kind with no entry
// here would render as an unlabelled line, so tests/test_traces.py asserts
// this object covers every kind — adding a kind to the parser without adding
// it here fails the suite. `assistant_text` is deliberately BLANK: the run's
// answer is the one thing that should carry no decoration.
const GLYPH = {
  assistant_text: "",
  reasoning: "\u{1F9E0}",          // brain — the agent thinking to itself
  tool_call: "\u{1F527}",          // wrench — it reached for a tool
  tool_result: "\u{1F9FE}",        // receipt — what the tool handed back
  permission_request: "\u{1F510}", // lock — it is asking to be allowed
  human_injection: "\u{1F4E5}",    // inbox — a human put this INTO the run
  lifecycle: "⚙",             // gear — the harness, not the agent
};
const UNKNOWN_GLYPH = "•";    // bullet — a kind this build does not know
// Machine chatter the parsers record but nobody reads while watching a run:
// progress pings, stream retries, usage counters, hook plumbing, turn and
// step markers. Measured on the live store, these were half of all events.
// Failures (turn.failed, error, session.error) are never in this set.
// Hidden by default; the "machine chatter" checkbox shows them.
const NOISE = new Set(["tool_progress", "stream_attempt", "usage",
  "hook_started", "hook_response", "step_start", "step-start",
  "step_finish", "step-finish", "session.idle", "session.updated",
  "message.updated", "thread.started", "turn.started", "turn.completed",
  "turn_started", "session.created"]);
// About 6–8 wrapped lines in the trace pane: useful at a glance without
// letting longer reasoning blocks take over the feed.
const SHORT_REASONING_CHARS = 512;

// Messages are conversation WITH the run, so they are glyphed by what the
// message is, not by which way it travelled (the arrow already says that).
const MSG_GLYPH = {
  interrupt: "\u{1F6A8}",  // siren — a tell waiting for a safe boundary
  tell: "\u{1F4E5}",
  ask: "❓",           // question — the run is blocked on an answer
  answer: "\u{1F4AC}",     // speech — the human answered it
  merge: "\u{1F500}",
};
function msgGlyph(m) {
  return MSG_GLYPH[m.kind] || (m.direction === "inbound" ? "\u{1F4E5}"
                                                         : "\u{1F4E4}");
}

function collapsible(cls, glyph, name, verb, payload, row, open = false) {
  const d = el("details", cls);
  d.open = open;
  const s = el("summary");
  s.append(el("i", "g", glyph), el("span", "name", name));
  if (verb) s.append(el("span", "dim", "· " + verb));
  s.append(el("span", "dim", "· " + row.payload_len + " chars" +
                             (row.truncated ? ", truncated at 2KB" : "")));
  const inner = el("div", "inner");
  inner.appendChild(el("pre", null, payload));
  d.append(s, inner);
  return d;
}

// A glyph in the gutter, a label, then the text — for the kinds that are not
// collapsed. Same 1.5rem indent as `collapsible`, so the whole trace lines up.
function eventItem(cls, glyph, label, note, payload) {
  const item = el("div", "titem evt " + cls);
  const body = el("div", "body");
  const head = el("div");
  head.append(el("span", "label", label));
  if (note) head.append(el("span", "dim", " · " + note));
  body.append(head);
  if (payload) body.append(el("div", "prose", payload));
  item.append(el("i", "g", glyph), body);
  return item;
}

function traceItem(row) {
  const payload = row.payload || "";
  const name = row.name || "";
  if (row.kind === "assistant_text")
    return el("div", "titem prose", payload);
  if (row.kind === "reasoning")
    return collapsible("think", GLYPH.reasoning, "thinking", name, payload, row,
                       row.payload_len <= SHORT_REASONING_CHARS);
  if (row.kind === "tool_call")
    return collapsible("tool", GLYPH.tool_call, name || "tool", "call", payload, row);
  if (row.kind === "tool_result")
    return collapsible("tool", GLYPH.tool_result, name || "tool", "result", payload, row);
  if (row.kind === "permission_request")
    return eventItem("permission", GLYPH.permission_request,
                     "permission requested", name || "?", payload);
  if (row.kind === "human_injection")
    return eventItem("injection", GLYPH.human_injection,
                     "put into the session", name, payload);
  if (row.kind === "lifecycle")
    return eventItem("meta" + (NOISE.has(name) ? " noise" : ""),
                     GLYPH.lifecycle, name || "lifecycle", "",
                     payload.slice(0, 300));
  return eventItem("meta", UNKNOWN_GLYPH, name || row.kind, row.kind,
                   payload.slice(0, 300));
}

// --- the daemon log stream (SSE) --------------------------------------------
let LOG = null;
const LOG_IDLE = "nothing written yet — the daemon logs a line per sweep";
function openLog() {
  if (LOG) return;
  $("logtail").replaceChildren(el("p", "dim", LOG_IDLE));
  $("logstate").textContent = "· live";
  const src = new EventSource("/api/log/stream");
  LOG = src;
  let empty = true;
  src.addEventListener("daemon", (e) => {
    let row;
    try { row = JSON.parse(e.data); } catch (err) { return; }
    const box = $("logtail");
    if (empty) { box.replaceChildren(); empty = false; }
    const line = el("div", row.file.includes("err") ? "bad" : null,
                    row.file + "  " + row.line);
    box.appendChild(line);
    while (box.childElementCount > 500) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  });
  src.onerror = () => { if (LOG === src) $("logstate").textContent = "· reconnecting…"; };
  src.onopen = () => { if (LOG === src) $("logstate").textContent = "· live"; };
}
function closeLog() {
  if (!LOG) return;
  LOG.close();
  LOG = null;
  $("logstate").textContent = "· paused (open this view to stream)";
}

// --- control turns ----------------------------------------------------------
// One row per machine decision: which layer spoke, on what profile, and its
// one-line reason. The summary already names the run it acted on, so the
// text is the link — no second pointer is stored.
function turnItem(t) {
  const item = el("div", "turnitem");
  const head = el("div");
  head.append(el("span", "chip c-turn", t.layer || "turn"),
              el("span", "dim", " " + [t.project || t.project_id, t.profile,
                                       ago(t.started_at)]
                                      .filter(Boolean).join(" · ")));
  item.append(head, el("div", "prose", (t.summary || "(no summary recorded)")
                                       .slice(0, 400)));
  return item;
}

async function loadTurns() {
  try {
    const data = await api("/api/turns?limit=30");
    $("turnstate").textContent = "· latest " + data.turns.length;
    $("turnsbox").replaceChildren(...(data.turns.length
      ? data.turns.map(turnItem)
      : [el("p", "dim",
            "no turns yet — the router, observer, and judge write one per decision")]));
  } catch (e) { fail(e); }
}

// --- profiles (W-0173) ------------------------------------------------------
// The model and effort controls are pickers fed by `/api/profiles/options`
// (what the harnesses themselves report), never free text — except for
// claude, which publishes no model listing. OpenCode has no --effort flag at
// all, so the effort control disables itself there instead of quietly
// accepting a value the launch would drop.
let OPTIONS = null, PROFILES = [], EDITING = null, DRAFT = {};

function backends() { return Object.keys(OPTIONS || {}); }

async function loadOptions(refreshNow) {
  try {
    OPTIONS = await api("/api/profiles/options" + (refreshNow ? "?refresh=1" : ""));
    const broken = backends().filter((b) => OPTIONS[b] && OPTIONS[b].error &&
                                          !(OPTIONS[b].models || []).length);
    $("discovery").textContent = broken.length
      ? "discovery: no models from " + broken.join(", ")
      : "discovery ok";
  } catch (e) {
    OPTIONS = OPTIONS || {};  // do not retry forever behind a dead route
    $("discovery").textContent = "discovery unavailable";
  }
}

// Discovery costs three subprocesses, so it is fetched the first time an
// editor opens, never on every poll.
function openEditor(name) {
  EDITING = name;
  DRAFT = null;
  if (OPTIONS) return drawEditor();
  loadOptions(false).then(drawEditor);
}

// The note is READ here and written in the editor. It was an inline input,
// which left a human asking whether the list was editable at all; one place
// to type a thing is the answer to that question.
function noteCell(p) {
  const box = el("span", "noteedit");
  box.append(el("span", null, p.note || "–"),
             el("span", "dim", p.note ? (p.note_age || "") : ""));
  return box;
}

function tierCell(p) {
  return p.tier ? p.tier + " " + (p.tier_name || "") : "–";
}

// The ENABLED SET (W-0187). `SCOPE.enabled_profiles` is null when the project
// has never said, and null means every profile — so the checkboxes read as
// all-on, and unticking the first one is what materialises the list.
function enabledNames() {
  if (!SCOPE || SCOPE.enabled_profiles === null ||
      SCOPE.enabled_profiles === undefined) return null;
  return SCOPE.enabled_profiles;
}

function isEnabled(name) {
  const list = enabledNames();
  return list === null || list.indexOf(name) >= 0;
}

// Optimistic: the box moves now and the 4s poll confirms it. A refused write
// puts the banner up and the next poll snaps the box back to the truth.
async function toggleEnabled(name, on) {
  const project = PROJECT;
  const list = enabledNames();
  const next = (list === null ? PROFILES.map((p) => p.name) : list.slice())
                 .filter((n) => n !== name);
  if (on) next.push(name);
  if (SCOPE) SCOPE.enabled_profiles = next;
  try {
    const res = await api("/api/project", {method: "POST", body: JSON.stringify(
      {project_id: project, enabled_profiles: next})});
    if (res.error) return fail(new Error(res.error));
  } catch (e) { fail(e); }
  // Nothing to re-fetch by hand: loadScope runs on the poll and the server's
  // answer replaces the optimistic list a tick later, refused or not.
}

function enabledCell(name) {
  const l = el("label", "enabledbox"), cb = el("input");
  cb.type = "checkbox";
  cb.checked = isEnabled(name);
  cb.disabled = !SCOPE;   // the enabled set has not landed yet
  cb.setAttribute("aria-label", "staff " + name + " in " + projectName(PROJECT));
  cb.onchange = () => toggleEnabled(name, cb.checked);
  l.appendChild(cb);
  return l;
}

function renderProfiles(s) {
  // Already in routing order: the server sorts by priority, then name.
  // Profiles are GLOBAL presets (W-0187), so this is the same list whatever
  // the picker says, and it is editable whatever the picker says. What a
  // project picks is which of them it may STAFF — the enabled column.
  const scoped = PROJECT !== null;
  PROFILES = s.profiles;
  const none = scoped && (enabledNames() || ["x"]).length === 0;
  $("profscope").textContent = !scoped ? ""
    : none ? "· " + projectName(PROJECT) + " enables NO profile — nothing can "
             + "be staffed for it until one is ticked"
    : "· enabled = " + projectName(PROJECT) + " may staff it; the profiles "
      + "themselves are global";
  $("profscope").className = none ? "warn" : "dim";
  // The 4s poll must not steal focus from the control a human is on.
  if ($("profiles").contains(document.activeElement)) return;
  if (!PROFILES.length) {
    $("profiles").replaceChildren(el("p", "dim", "no profiles yet — add one"));
    return;
  }
  const head = ["name", "harness", "model", "effort", "pri", "tier",
                "note", ""];
  if (scoped) head.unshift("on");
  $("profiles").replaceChildren(table(head,
    PROFILES.map((p) => {
      const row = [
        p.name, p.backend, p.model || "(default)", p.effort,
        p.priority, tierCell(p),
        {node: noteCell(p), cls: "grow"},
        editButton(p.name),
      ];
      if (scoped) row.unshift({node: enabledCell(p.name)});
      return row;
    })));
}

function editButton(name) {
  const b = el("button", "glyph", "✎");   // pencil
  b.title = "edit " + name;
  b.setAttribute("aria-label", "edit " + name);
  b.onclick = () => openEditor(name);
  return b;
}

function opts(backend) {
  return (OPTIONS && OPTIONS[backend]) || {models: [], supports_effort: true};
}

function drawEditor() {
  const box = $("editor");
  const existing = PROFILES.find((p) => p.name === EDITING) || {};
  if (DRAFT === null) DRAFT = Object.assign({backend: "opencode"}, existing);
  const o = opts(DRAFT.backend);
  const models = o.models || [];
  box.hidden = false;
  box.replaceChildren();

  const add = (text, node, hint) => {
    const l = el("label"); l.append(el("span", null, text), node); box.append(l);
    if (hint) box.append(el("div", "hint", hint));
  };
  const input = (key, type) => {
    const i = el("input");
    i.type = type || "text";
    i.value = DRAFT[key] === null || DRAFT[key] === undefined ? "" : DRAFT[key];
    i.oninput = () => { DRAFT[key] = i.value; };
    return i;
  };
  const select = (key, choices, blank) => {
    const s = el("select");
    (blank === false ? choices : [""].concat(choices)).forEach((c) => {
      const op = el("option", null, c === "" ? "— pick —" : c);
      op.value = c;
      if (String(DRAFT[key] || "") === c) op.selected = true;
      s.appendChild(op);
    });
    s.onchange = () => { DRAFT[key] = s.value; drawEditor(); };
    return s;
  };

  const nameIn = input("name");
  nameIn.disabled = !!EDITING;
  add("name", nameIn);
  add("harness", select("backend", backends(), false));

  // model and effort share one line: they are one decision, and the effort a
  // model declares only means anything next to the model it came from.
  const pair = el("div", "row");
  let modelNode, modelHint = "";
  if (o.free_model) {
    modelNode = input("model");
    modelHint = o.error || "";
  } else if (models.length) {
    modelNode = select("model", models.map((m) => m.id));
    modelHint = models.length + " reported by discovery";
  } else {
    modelNode = input("model");
  }
  pair.append(modelNode);

  // An effort control appears ONLY where an effort exists to set: a select
  // when the model declares its list, a typed box where the harness takes
  // any effort (claude). A harness that declares none gets no control —
  // there is nothing to choose, so nothing is drawn.
  const picked = models.find((m) => m.id === DRAFT.model);
  const efforts = (picked && picked.efforts) || [];
  let effortHint = modelHint;
  if (o.supports_effort === false) {
    DRAFT.effort = "";
    effortHint = modelHint || o.effort_note || "";
  } else if (efforts.length) {
    pair.append(el("span", "dim", "effort"), select("effort", efforts));
  } else if (o.free_effort) {
    pair.append(el("span", "dim", "effort"), input("effort"));
  } else {
    DRAFT.effort = "";
  }
  add("model / effort", pair, effortHint);

  if (DRAFT.backend === "opencode") add("variant", input("variant"));

  // Routing metadata a planner reads (W-0181).
  add("tier", select("tier", ["1", "2", "3"]),
      "1 workhorse — a well-defined bounded task · 2 generalist · " +
      "3 heavy — the frontier model, for the hardest thinking");
  add("priority", input("priority", "number"),
      "0–99, like a linux process nice value: LOWER is more preferred. " +
      "Orders profiles of the same tier against each other. Default 50.");

  add("note", input("note"),
      "the headroom note, authoritative over measured runway. This is the " +
      "only place it is typed; the list shows it.");

  const row = el("div", "row");
  const save = el("button", null, EDITING ? "save" : "create");
  save.onclick = () => {
    const name = (EDITING || DRAFT.name || "").trim();
    if (!name) return fail(new Error("a profile needs a name"));
    const body = {};
    ["backend", "model", "effort", "variant", "tier", "priority",
     "note"].forEach((k) => {
      if (DRAFT[k] !== undefined) body[k] = DRAFT[k];
    });
    saveProfile(name, body);
  };
  const cancel = el("button", null, "cancel");
  cancel.onclick = () => { EDITING = null; DRAFT = {}; $("editor").hidden = true; };
  row.append(save, cancel);
  if (EDITING) {
    const rm = el("button", "danger", "remove");
    rm.onclick = () => {
      if (confirm("remove profile " + EDITING + "?"))
        saveProfile(EDITING, null, true);
    };
    row.append(rm);
  }
  const rediscover = el("button", null, "re-run discovery");
  rediscover.onclick = async () => { await loadOptions(true); drawEditor(); };
  row.append(rediscover);
  box.append(row);
}

async function saveProfile(name, profile, remove) {
  try {
    const res = await api("/api/profiles/" + encodeURIComponent(name),
      {method: "POST",
       body: JSON.stringify(remove ? {delete: true} : {profile: profile})});
    if (res.error) return fail(new Error(res.error));
    if (!res.applied) return fail(new Error(
      "needs a human decision: " + (res.needs || []).join(", ")));
    EDITING = null; DRAFT = {}; $("editor").hidden = true;
    await refresh();
  } catch (e) { fail(e); }
}

// --- runway -----------------------------------------------------------------
// ONE card per provider, its windows inside it: Claude's 5-hour and weekly
// limits are two windows of one plan, not two providers.
const CURRENCY = /^[A-Z]{3}$/;
const RUNWAY_MS = 300000;
// Which providers the reader collapsed, so the 4s poll cannot re-open them.
const RUNWAY_SHUT = new Set();

function tone(percent) {
  return percent === null ? "" : percent <= 15 ? "critical"
       : percent <= 35 ? "watch" : "";
}
function pct(n) {
  return n === null || n === undefined ? "–" : Math.round(n) + "%";
}
function balanceOf(r) {
  // Only an api provider is billed per token, and only it has money to show.
  return (r.kind !== "plan" && r.known && CURRENCY.test(r.unit || ""))
    ? new Intl.NumberFormat([], {style: "currency", currency: r.unit})
        .format(r.remaining)
    : null;
}

function renderRunway(list) {
  renderRunwayStrip(list);
  const box = $("runway");
  if (!list.length) {
    box.replaceChildren(el("p", "dim", "no polls yet — press refresh"));
    return;
  }
  box.replaceChildren(...list.map(runwayCard));
}

// The header strip. Every chip is a door to the runway view, and both
// renderers feed it: the 4s snapshot and an explicit refresh.
const MONOGRAMS = {minimax: "MM", kimi: "K", claude: "CL", deepseek: "DS",
                   codex: "CX", xai: "X"};
function renderRunwayStrip(list) {
  const strip = $("rwstrip");
  strip.replaceChildren(...(list || []).map((r) => {
    const money = balanceOf(r);
    const known = r.windows.filter((w) => w.remaining != null);
    const headroom = r.known && known.length
      ? Math.round(Math.min(...known.map((w) => w.remaining))) : null;
    const chip = el("button",
      "rwchip" + (money || headroom !== null ? "" : " unavailable"));
    chip.type = "button";
    chip.title = r.provider
      + (r.age_hours != null && r.age_hours >= 2
         ? " · read " + ageText(r.age_hours) + " ago" : "");
    chip.append(
      el("span", null, MONOGRAMS[r.provider] || r.provider.slice(0, 2).toUpperCase()),
      el("b", money ? null : tone(headroom) || null,
         money || (headroom !== null ? pct(headroom) : "–")));
    chip.onclick = () => showView("runway");
    return chip;
  }));
}

function ageText(hours) {
  if (hours < 1) return Math.round(hours * 60) + "m";
  if (hours < 48) return Math.round(hours) + "h";
  return Math.round(hours / 24) + "d";
}

function runwayCard(r) {
  const money = balanceOf(r);
  const card = el("details", "rw");
  card.open = !RUNWAY_SHUT.has(r.provider);
  card.ontoggle = () => {
    if (card.open) RUNWAY_SHUT.delete(r.provider);
    else RUNWAY_SHUT.add(r.provider);
  };
  const sum = el("summary");
  const name = el("span", "rwname");
  name.append(el("strong", null, r.provider),
              el("span", null, r.kind === "plan" ? "coding plan"
                                                 : "pay per token"));
  // A reading Orchestra cannot refresh by polling -- Claude's is a cache file
  // Claude Code writes -- can be days behind with nothing broken. Say the age
  // once it is old enough to change what the number means.
  if (r.age_hours != null && r.age_hours >= 2) {
    name.append(el("span", "rwage", "read " + ageText(r.age_hours) + " ago"));
  }
  const known = r.windows.filter((w) => w.remaining != null);
  const headroom = known.length ? Math.min(...known.map((w) => w.remaining))
                                    : null;
  sum.append(name, money
    ? el("span", "rwvalue", money)
    : el("span", "rwvalue " + (r.known && headroom !== null
                               ? tone(Math.round(headroom)) : "unknown"),
         r.known && headroom !== null ? pct(headroom) : "unknown"));
  const body = el("div", "rwbody");
  card.append(sum, body);

  // One block for everything a provider banks: DeepSeek's dollar balance,
  // Codex's and Grok's banked usage resets. Money is formatted here because
  // only the browser knows the reader's locale; everything else arrives as a
  // phrase its own adapter wrote.
  if (money || r.credits) {
    const bal = el("div", "rwbal");
    if (money) bal.append(el("strong", null, money),
                          document.createTextNode(" balance"));
    else bal.append(r.credits);
    body.append(bal);
  }
  r.windows.forEach((w) => body.append(runwayWindow(w)));
  if (!r.windows.length && !money && !r.credits)
    body.append(el("div", "rwmeta", r.reason || "no reading"));
  return card;
}

function runwayWindow(w) {
  const q = el("div", "rwq"), head = el("div", "rwqhead");
  // A window whose reset has passed has NO current value, and the daemon sends
  // null for it. Drawing a dimmed bar at the old number said "you have 88%
  // left" in a quieter voice; it was still saying it. No bar at all is the
  // same shape an unreported provider gets, which is what this is.
  if (w.remaining === null || w.remaining === undefined) {
    head.append(el("span", null, w.label), el("b", "rwunknown", "not known"));
    q.append(head, el("div", "rwmeta", w.stale_reason || "no reading"));
    return q;
  }
  const percent = Math.round(w.remaining);
  const shade = tone(percent);
  head.append(el("span", null, w.label), el("b", null, pct(w.remaining)));
  const track = el("div", "track"), fill = el("div", "fill " + shade);
  fill.style.width = Math.max(0, Math.min(100, percent)) + "%";
  track.append(fill);
  // A per-model window carries no reset time, and until_text renders that as
  // "-", so the naive check printed a bare "resets -".
  const resets = w.resets_in && w.resets_in !== "-" ? "resets " + w.resets_in : null;
  const meta = el("div", "rwmeta", [resets, w.pace].filter(Boolean).join(" · "));
  q.append(head, track, meta);
  return q;
}

// The refresh route POLLS the providers with ?refresh=1; the 4s snapshot only
// replays whatever the last poll stored.
let runwayBusy = false;
async function refreshRunway() {
  if (runwayBusy) return;
  runwayBusy = true;
  $("runwayrefresh").disabled = true;
  $("runwayrefresh").textContent = "refreshing…";
  try {
    const data = await api("/api/runway?refresh=1", {cache: "no-store"});
    renderRunway(data.runway);
    $("runwaystamp").textContent = "· checked " +
      new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  } catch (e) {
    fail(e);
  } finally {
    runwayBusy = false;
    $("runwayrefresh").disabled = false;
    $("runwayrefresh").textContent = "refresh";
  }
}

// --- statistics (W-0186) ----------------------------------------------------
// A popup on the RUNS page, not a card on health: health is the daemon's own
// pulse, and totals about runs belong beside the runs. The numbers are over
// the WHOLE runs table, not the snapshot's 30-run window, and they follow the
// project picker — SCOPE.statistics is the same computation over that
// project's runs alone.
function renderStats(s) {
  const st = (SCOPE && SCOPE.statistics) || s.statistics;
  $("statsscope").textContent = PROJECT === null
    ? "· every run"
    : "· " + projectName(PROJECT) + (SCOPE ? "" : " (loading…)");
  const head = kv([
    ["runs", st.runs_total + " total · " + st.runs_active + " active"],
    ["worker time", dur(st.worker_seconds)],
    ["tokens", num(st.tokens_total)],
    ["cost", money(st.cost_usd) + (st.plan_runs
        ? "   (" + st.plan_runs + " plan runs unpriced)" : "")],
    ["by status", Object.keys(st.by_status).sort()
        .map((k) => k + " " + st.by_status[k]).join("   ") || "–"],
    // What the header stamp used to say. A payload version and a generation
    // time are worth one line where someone goes looking for numbers, not a
    // permanent chip in the chrome (W-0186).
    ["snapshot", "v" + s.version + " · " + s.generated_at],
  ]);
  const per = st.by_profile.length
    ? table(["profile", "runs", "active", "time", "tokens", "cost"],
        st.by_profile.map((p) => [p.profile, p.runs, p.active, dur(p.seconds),
                                  num(p.tokens),
                                  p.billing === "plan" ? "plan"
                                  : p.cost === null ? "–" : money(p.cost)]))
    : el("p", "dim", "no runs recorded yet");
  $("stats").replaceChildren(head, block("per profile", per));
}

// No CLI commands here: the daemon writes this, and the buttons below drive
// it. Naming a command a button already performs is noise (W-0183).
// W-0189: the observer row comes FIRST and is rendered even before the first
// sweep. A health view that reads "ok" while nothing is watching any run for
// spin is the exact failure this row exists to make impossible.
function observerRow(o) {
  if (!o) return ["spin observer", el("span", "dim", "unknown")];
  if (!o.enabled) {
    return ["spin observer", el("span", "bad",
      "DISABLED — nothing is watching runs · " + (o.problem || ""))];
  }
  return ["spin observer", el("span", "ok", o.profile + " · first look after " +
                              Math.round((o.first_look || 0) / 60) + "m, then hourly")];
}

function renderDaemon(d) {
  d = d || {};
  if (!d.last_sweep_at) {
    $("daemon").replaceChildren(kv([observerRow(d.observer)]), el("p", "dim",
      "no sweep reported yet — the daemon records one every tick"));
    return;
  }
  $("daemon").replaceChildren(kv([
    observerRow(d.observer),
    ["last sweep", (d.last_sweep_at || "never") +
                   (d.last_sweep_at ? "  (" + ago(d.last_sweep_at) + ")" : "")],
    ["outcome", el("span", d.outcome === "ok" ? "ok"
                         : d.outcome === "paused" ? "warn" : "bad",
                   d.outcome || "unknown")],
    ["claimed", (d.claimed && d.claimed.length) ? d.claimed.join(", ") : "none"],
    ["actions", d.actions],
    ["released / reaped", (d.released || 0) + " / " + (d.reaped || 0)],
    ["error", el("span", d.error ? "bad" : "dim", d.error || "none")],
    ["last error", el("span", "dim", d.last_error
        ? d.last_error + " (" + d.last_error_at + ")" : "none")],
    ["pid", d.pid],
    ["up since", d.started_at],
  ]));
}

// --- the poll ---------------------------------------------------------------
let paused = false;
function render(s) {
  SNAP = s;
  $("banner").textContent = "";
  $("livecount").textContent = s.live_runs;
  paused = s.dispatch.paused;
  $("paused").hidden = !paused;
  $("paused").textContent = "dispatch is PAUSED since " + (s.dispatch.since || "?") +
                            " — running work continues, nothing new starts";
  $("pause").textContent = paused ? "resume dispatch" : "pause dispatch";
  $("pause").className = paused ? "resume" : "pause";
  // The picker runs first: it can fall back to "all projects" when the
  // selected one ages out, and everything below reads that decision.
  renderProjects(s);
  loadScope();
  // A first load lands on the newest run ON THE BOARD, so the detail pane is
  // never empty when there is something to show.
  const shown = visibleRuns(s);
  if (SELECTED === null && shown.length) selectRun(shown[0].id);
  renderRunList(s);
  renderDetail(s);
  renderProfiles(s);
  renderRunway(s.runway);
  renderStats(s);
  renderDaemon(s.daemon || {});
}

async function refresh() {
  const s = await api("/api/snapshot");
  $("views").hidden = false;
  $("keyform").hidden = true;
  render(s);
}

// --- raw config (W-0190) ----------------------------------------------------
// The file is the form. Dirty means "do not clobber what they are typing"
// if they leave the tab and come back.
let CONFIG_DIRTY = false;
async function loadConfig(force) {
  if (!force && (CONFIG_DIRTY || $("cfgtext") === document.activeElement)) return;
  try {
    const d = await api("/api/config");
    $("cfgtext").value = d.text;
    $("cfgpath").textContent = d.path || "";
    $("cfgmsg").textContent = "";
    CONFIG_DIRTY = false;
  } catch (e) { fail(e); }
}
$("cfgtext").oninput = () => { CONFIG_DIRTY = true; };
$("cfgsave").onclick = async () => {
  const b = $("cfgsave");
  b.disabled = true;
  $("cfgmsg").textContent = "saving…";
  try {
    const res = await api("/api/config", {method: "POST",
      body: JSON.stringify({text: $("cfgtext").value, restart: true})});
    CONFIG_DIRTY = false;
    $("cfgmsg").textContent = res.restarting ? "saved — restarting…" : "saved";
  } catch (e) {
    fail(e);
    $("cfgmsg").textContent = "not saved";
  }
  setTimeout(() => { b.disabled = false; }, 6000);
};

$("addprofile").onclick = () => openEditor("");
$("runwayrefresh").onclick = () => refreshRunway();
// <dialog> is the platform's own modal: Esc, the backdrop and the focus trap
// come with it, so this is the whole popup.
$("statsbtn").onclick = () => $("statsdlg").showModal();
$("statsclose").onclick = () => $("statsdlg").close();
$("sweep").onclick = () => act("/api/sweep", {method: "POST"});
$("pause").onclick = () => act("/api/dispatch/" + (paused ? "resume" : "pause"),
                               {method: "POST"});
// The daemon re-execs, so the page it served goes away for a moment. Say so
// rather than letting the next poll look like a crash.
$("restart").onclick = () => {
  const b = $("restart");
  b.disabled = true;
  b.textContent = "restarting…";
  act("/api/restart", {method: "POST"});
  setTimeout(() => { b.disabled = false; b.textContent = "restart service"; }, 6000);
};
$("keyform").onsubmit = (e) => {
  e.preventDefault();
  KEY = $("keyinput").value.trim();
  saveKey(KEY);
  tick();
};

async function tick() {
  try {
    await refresh();
  } catch (e) {
    fail(e);
    if (String(e.message || e).startsWith("401")) {
      $("views").hidden = true;
      $("keyform").hidden = false;
      closeTrace();
      closeLog();
    }
  }
}

// A first visit arrives as /?key=…; the server parked it in a cookie, so
// drop it from the address bar before anyone screenshots the URL.
if (location.search.includes("key=")) {
  saveKey(readKey());
  history.replaceState(null, "", location.pathname);
}
if (KEY) saveKey(KEY);
showView("runs");
tick();
setInterval(tick, POLL_MS);
// Nothing else polls the providers on a timer, so this is what keeps the
// stored numbers current for the conductor as well as for the view.
setInterval(refreshRunway, RUNWAY_MS);
</script>
</body>
</html>
